<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Progressive Jackpot — MINI / MINOR</title>
        <link rel="stylesheet" href="css/fuentes.css" />
        <link rel="stylesheet" href="css/principal.css" />
        <link rel="stylesheet" href="css/home-diseno.css" />
        <link rel="stylesheet" href="css/promo-diseno.css" />
        <link rel="stylesheet" href="css/hojas-diseno.css" />
    </head>

    <script src="js/carga.js"></script>

    <body>
        <script src="js/autoplay.js"></script>

        <!-- VHS overlay (scanlines encima del promo video) -->
        <div class="promo-vhs-overlay" id="promoVhsOverlay"></div>
        <!-- Glitch overlay (efecto de aparicion) -->
        <div class="promo-glitch" id="promoGlitch"></div>

        <!-- PROMO: letrero y placa de pozos que rota entre GRAND/MAJOR/MINOR/MINI
             (la arma y la actualiza js/promo-hud.js) -->
        <div class="promo-marca" id="promoMarca"><span>PROGRESIVO RACE</span></div>
        <div class="promo-pozos" id="promoPozos"></div>
        <div class="promo-puntos" id="promoPuntos"></div>

        <!-- Timer del propio promo (cuanto le falta al video) -->
        <div class="promo-timer" id="promoTimer">
            <div class="promo-timer-track">
                <div class="promo-timer-fill" id="promoTimerFill"></div>
            </div>
            <div class="promo-timer-text" id="promoTimerText">8s</div>
        </div>
        <!-- Barra de progreso al siguiente promo -->
        <div class="next-promo-bar" id="nextPromoBar">
            <div class="next-promo-bar-track">
                <div class="next-promo-bar-fill" id="nextPromoFill"></div>
            </div>
            <div class="next-promo-text" id="nextPromoText">SIGUIENTE VIDEO: 30s</div>
        </div>

        <!-- PRELOADER -->
        <div class="preloader" id="preloader">
            <div class="preloader-spinner"></div>
            <div class="preloader-text" id="preloaderText">CARGANDO... 0%</div>
            <div class="preloader-progress-bar">
                <div class="preloader-progress-fill" id="preloaderProgressFill"></div>
            </div>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="shield-box" id="shieldBox">
                <!-- AUDIO DE FONDO permanente (se silencia durante ganador y promos) -->
                <audio id="bgMusic" loop preload="auto" style="display: none">
                    <source src="audio/background-music.mp3" type="audio/mpeg" />
                    <source src="audio/background-music.ogg" type="audio/ogg" />
                </audio>

                <!-- VIDEOS PROMO: container vacio - se llenan dinamicamente desde la carpeta promos/ -->
                <div id="promoVideosContainer"></div>

                <!-- ESCUDO SVG -->
                <svg class="shield-svg" id="shieldSvg" preserveAspectRatio="xMidYMid meet"></svg>
                <!-- capa aparte con lo que se mueve (barra neon y vehiculo) para no redibujar el escudo en cada cuadro -->
                <svg class="shield-svg shield-anim" id="shieldAnimSvg" preserveAspectRatio="xMidYMid meet"></svg>

                <!-- HOJAS DEL CARRUSEL -->
                <div class="sheets-wrapper" id="sheetsWrapper">
                    <!-- Las hojas se generan dinamicamente con JS -->
                </div>
            </div>
        </div>

        <script src="js/premios.js"></script>
        <script src="js/principal.js"></script>
        <script src="js/home-diseno.js"></script>
        <script src="js/hojas-diseno.js"></script>

        <!-- ============================================================
     MOTO 3D giratoria con three.js (rotacion REAL fluida)
     ============================================================ -->
        <!-- Three.js eliminado - ahora se usan sprite-sheets -->
        <!-- Script Three.js moto eliminado -->

        <!-- ============================================================
     AUTO 3D (F1) giratorio en hoja GRAND
     ============================================================ -->
        <!-- Script Three.js auto F1 eliminado -->

        <!-- ============================================================
     SISTEMA DE VIDEOS PROMO ALEATORIOS
     ============================================================ -->
        <script src="js/promos.js"></script>

        <!-- ============================================================
     MODAL DE GANADOR + HANDLERS DE API EXTERNA
     ============================================================ -->
        <link rel="stylesheet" href="css/ganador.css" />

        <link rel="stylesheet" href="css/ganador-acreditado.css" />

        <!-- Modal de ganador HTML -->
        <div class="winner-modal" id="winnerModal">
            <!-- Audio del ganador (suena al aparecer el modal).
       Si el archivo no existe, no rompe nada, solo no suena. -->
            <audio id="winnerAudio" preload="auto" style="display: none">
                <source src="audio/winner.mp3" type="audio/mpeg" />
            </audio>

            <!-- Confeti canvas -->
            <canvas class="winner-confetti" id="winnerConfetti"></canvas>

            <!-- LÍNEAS DE VELOCIDAD horizontales que cruzan el modal -->
            <svg class="winner-speed-lines" viewBox="0 0 1920 1080" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="speedLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffd700" stop-opacity="0" />
                        <stop offset="50%" stop-color="#ffd700" stop-opacity="1" />
                        <stop offset="100%" stop-color="#ffd700" stop-opacity="0" />
                    </linearGradient>
                    <linearGradient id="speedLineGradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ff6600" stop-opacity="0" />
                        <stop offset="50%" stop-color="#ff6600" stop-opacity="1" />
                        <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <!-- 8 líneas de velocidad que cruzan a diferentes velocidades -->
                <line x1="-300" y1="120" x2="0" y2="120" stroke="url(#speedLineGrad)" stroke-width="3">
                    <animate attributeName="x1" from="-300" to="1920" dur="0.8s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0" to="2220" dur="0.8s" repeatCount="indefinite" />
                </line>
                <line x1="-300" y1="240" x2="0" y2="240" stroke="url(#speedLineGradOrange)" stroke-width="2">
                    <animate attributeName="x1" from="-300" to="1920" dur="1.1s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0" to="2220" dur="1.1s" repeatCount="indefinite" />
                </line>
                <line x1="-300" y1="380" x2="0" y2="380" stroke="url(#speedLineGrad)" stroke-width="4">
                    <animate attributeName="x1" from="-300" to="1920" dur="0.6s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0" to="2220" dur="0.6s" repeatCount="indefinite" />
                </line>
                <line x1="-300" y1="540" x2="0" y2="540" stroke="url(#speedLineGradOrange)" stroke-width="3">
                    <animate attributeName="x1" from="-300" to="1920" dur="0.9s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0" to="2220" dur="0.9s" repeatCount="indefinite" />
                </line>
                <line x1="-300" y1="700" x2="0" y2="700" stroke="url(#speedLineGrad)" stroke-width="2">
                    <animate attributeName="x1" from="-300" to="1920" dur="1.3s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0" to="2220" dur="1.3s" repeatCount="indefinite" />
                </line>
                <line x1="-300" y1="860" x2="0" y2="860" stroke="url(#speedLineGradOrange)" stroke-width="4">
                    <animate attributeName="x1" from="-300" to="1920" dur="0.7s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0" to="2220" dur="0.7s" repeatCount="indefinite" />
                </line>
                <line x1="-300" y1="960" x2="0" y2="960" stroke="url(#speedLineGrad)" stroke-width="3">
                    <animate attributeName="x1" from="-300" to="1920" dur="1s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0" to="2220" dur="1s" repeatCount="indefinite" />
                </line>
            </svg>

            <!-- BANDERA A CUADROS izquierda (estilo F1) -->
            <svg class="winner-flag left" viewBox="0 0 200 600" preserveAspectRatio="none">
                <defs>
                    <pattern id="checkered-left" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                        <rect x="0" y="0" width="20" height="20" fill="#fff" />
                        <rect x="20" y="20" width="20" height="20" fill="#fff" />
                        <rect x="20" y="0" width="20" height="20" fill="#000" />
                        <rect x="0" y="20" width="20" height="20" fill="#000" />
                    </pattern>
                </defs>
                <!-- Bandera ondeando con path animado -->
                <path d="M 0,0 Q 50,30 100,0 T 200,0 L 200,600 Q 150,570 100,600 T 0,600 Z" fill="url(#checkered-left)" opacity="0.85">
                    <animate
                        attributeName="d"
                        values="M 0,0 Q 50,30 100,0 T 200,0 L 200,600 Q 150,570 100,600 T 0,600 Z;
                M 0,0 Q 50,-20 100,0 T 200,0 L 200,600 Q 150,620 100,600 T 0,600 Z;
                M 0,0 Q 50,30 100,0 T 200,0 L 200,600 Q 150,570 100,600 T 0,600 Z"
                        dur="2s"
                        repeatCount="indefinite"
                    />
                </path>
            </svg>

            <!-- BANDERA A CUADROS derecha -->
            <svg class="winner-flag right" viewBox="0 0 200 600" preserveAspectRatio="none">
                <defs>
                    <pattern id="checkered-right" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                        <rect x="0" y="0" width="20" height="20" fill="#fff" />
                        <rect x="20" y="20" width="20" height="20" fill="#fff" />
                        <rect x="20" y="0" width="20" height="20" fill="#000" />
                        <rect x="0" y="20" width="20" height="20" fill="#000" />
                    </pattern>
                </defs>
                <path d="M 0,0 Q 50,-20 100,0 T 200,0 L 200,600 Q 150,620 100,600 T 0,600 Z" fill="url(#checkered-right)" opacity="0.85">
                    <animate
                        attributeName="d"
                        values="M 0,0 Q 50,-20 100,0 T 200,0 L 200,600 Q 150,620 100,600 T 0,600 Z;
                M 0,0 Q 50,30 100,0 T 200,0 L 200,600 Q 150,570 100,600 T 0,600 Z;
                M 0,0 Q 50,-20 100,0 T 200,0 L 200,600 Q 150,620 100,600 T 0,600 Z"
                        dur="2s"
                        repeatCount="indefinite"
                    />
                </path>
            </svg>

            <!-- CHISPAS SVG laterales (estilo motor revolucionado) -->
            <svg class="winner-sparks" viewBox="0 0 1920 1080" preserveAspectRatio="none">
                <g class="spark-group-1">
                    <circle cx="200" cy="400" r="3" fill="#ffaa00">
                        <animate attributeName="cy" values="400;200" dur="0.8s" repeatCount="indefinite" />
                        <animate attributeName="cx" values="200;180" dur="0.8s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="1;0" dur="0.8s" repeatCount="indefinite" />
                        <animate attributeName="r" values="3;0" dur="0.8s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="220" cy="500" r="2" fill="#ff6600">
                        <animate attributeName="cy" values="500;100" dur="1.2s" repeatCount="indefinite" />
                        <animate attributeName="cx" values="220;240" dur="1.2s" repeatCount="indefinite" />
                        <animate attributeName="opacity" values="1;0" dur="1.2s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="180" cy="700" r="2.5" fill="#ffd700">
                        <animate attributeName="cy" values="700;300" dur="1s" repeatCount="indefinite" begin="0.2s" />
                        <animate attributeName="cx" values="180;160" dur="1s" repeatCount="indefinite" begin="0.2s" />
                        <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite" begin="0.2s" />
                    </circle>

                    <circle cx="1700" cy="400" r="3" fill="#ffaa00">
                        <animate attributeName="cy" values="400;200" dur="0.9s" repeatCount="indefinite" begin="0.1s" />
                        <animate attributeName="cx" values="1700;1720" dur="0.9s" repeatCount="indefinite" begin="0.1s" />
                        <animate attributeName="opacity" values="1;0" dur="0.9s" repeatCount="indefinite" begin="0.1s" />
                    </circle>
                    <circle cx="1740" cy="600" r="2" fill="#ff6600">
                        <animate attributeName="cy" values="600;200" dur="1.1s" repeatCount="indefinite" begin="0.3s" />
                        <animate attributeName="cx" values="1740;1720" dur="1.1s" repeatCount="indefinite" begin="0.3s" />
                        <animate attributeName="opacity" values="1;0" dur="1.1s" repeatCount="indefinite" begin="0.3s" />
                    </circle>
                    <circle cx="1680" cy="800" r="2.5" fill="#ffd700">
                        <animate attributeName="cy" values="800;400" dur="1.3s" repeatCount="indefinite" begin="0.5s" />
                        <animate attributeName="cx" values="1680;1700" dur="1.3s" repeatCount="indefinite" begin="0.5s" />
                        <animate attributeName="opacity" values="1;0" dur="1.3s" repeatCount="indefinite" begin="0.5s" />
                    </circle>
                </g>
            </svg>

            <!-- Rayos de luz radiales desde el centro -->
            <svg class="winner-rays" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <linearGradient id="rayGrad" x1="0%" y1="50%" x2="100%" y2="50%">
                        <stop offset="0%" stop-color="#ffd700" stop-opacity="0" />
                        <stop offset="50%" stop-color="#ffd700" stop-opacity="0.7" />
                        <stop offset="100%" stop-color="#ffd700" stop-opacity="0" />
                    </linearGradient>
                    <linearGradient id="rayGrad2" x1="0%" y1="50%" x2="100%" y2="50%">
                        <stop offset="0%" stop-color="#ff6600" stop-opacity="0" />
                        <stop offset="50%" stop-color="#ff6600" stop-opacity="0.5" />
                        <stop offset="100%" stop-color="#ff6600" stop-opacity="0" />
                    </linearGradient>
                </defs>
                <g transform="translate(400 400)">
                    <!-- 12 rayos dorados -->
                    <rect x="-400" y="-3" width="800" height="6" fill="url(#rayGrad)" />
                    <rect x="-400" y="-3" width="800" height="6" fill="url(#rayGrad)" transform="rotate(30)" />
                    <rect x="-400" y="-3" width="800" height="6" fill="url(#rayGrad)" transform="rotate(60)" />
                    <rect x="-400" y="-3" width="800" height="6" fill="url(#rayGrad)" transform="rotate(90)" />
                    <rect x="-400" y="-3" width="800" height="6" fill="url(#rayGrad)" transform="rotate(120)" />
                    <rect x="-400" y="-3" width="800" height="6" fill="url(#rayGrad)" transform="rotate(150)" />
                    <!-- 6 rayos naranjas intermedios mas delgados -->
                    <rect x="-400" y="-1.5" width="800" height="3" fill="url(#rayGrad2)" transform="rotate(15)" />
                    <rect x="-400" y="-1.5" width="800" height="3" fill="url(#rayGrad2)" transform="rotate(45)" />
                    <rect x="-400" y="-1.5" width="800" height="3" fill="url(#rayGrad2)" transform="rotate(75)" />
                    <rect x="-400" y="-1.5" width="800" height="3" fill="url(#rayGrad2)" transform="rotate(105)" />
                    <rect x="-400" y="-1.5" width="800" height="3" fill="url(#rayGrad2)" transform="rotate(135)" />
                    <rect x="-400" y="-1.5" width="800" height="3" fill="url(#rayGrad2)" transform="rotate(165)" />
                </g>
            </svg>

            <!-- Marco principal con texto -->
            <div class="winner-frame">
                <!-- Fondo a cuadros (tipo F1) -->
                <div class="winner-checkered-bg">
                    <svg viewBox="0 0 700 520" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <rect width="700" height="520" fill="#0b1832" />
                        <g fill="none" stroke="#c08a47" stroke-width="1.2" opacity="0.35">
                            <circle cx="80" cy="260" r="60" />
                            <circle cx="80" cy="260" r="90" />
                            <circle cx="80" cy="260" r="120" />
                            <path d="M0 120 C120 40, 120 480, 250 260 C120 40, 120 480, 0 400" />
                            <path d="M20 80 C160 120, 160 420, 260 260 C160 120, 160 420, 20 440" />
                            <circle cx="620" cy="260" r="60" />
                            <circle cx="620" cy="260" r="90" />
                            <circle cx="620" cy="260" r="120" />
                            <path d="M700 120 C580 40, 580 480, 450 260 C580 40, 580 480, 700 400" />
                            <path d="M680 80 C540 120, 540 420, 440 260 C540 120, 540 420, 680 440" />
                        </g>
                    </svg>
                </div>

                <!-- CONFETI a los lados (entre ambos cuadros), con movimiento suave -->
                <svg class="capa-confeti" viewBox="0 0 1200 600" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="oro-metalico" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="20%" stop-color="#ffe673" />
                            <stop offset="45%" stop-color="#f5b82e" />
                            <stop offset="48%" stop-color="#ffffff" />
                            <stop offset="55%" stop-color="#d19417" />
                            <stop offset="85%" stop-color="#7a4700" />
                            <stop offset="100%" stop-color="#422200" />
                        </linearGradient>
                        <linearGradient id="cobre-metalico" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#f3a175" />
                            <stop offset="30%" stop-color="#d47443" />
                            <stop offset="50%" stop-color="#ffffff" />
                            <stop offset="70%" stop-color="#a64d22" />
                            <stop offset="100%" stop-color="#542007" />
                        </linearGradient>
                        <linearGradient id="rojo-festivo" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ff8a8a" />
                            <stop offset="50%" stop-color="#ff2d2d" />
                            <stop offset="100%" stop-color="#8a0010" />
                        </linearGradient>
                        <linearGradient id="blanco-festivo" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ffffff" />
                            <stop offset="50%" stop-color="#e8eefc" />
                            <stop offset="100%" stop-color="#9fb0d0" />
                        </linearGradient>
                        <linearGradient id="turquesa-festivo" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#9bfff4" />
                            <stop offset="50%" stop-color="#00e5d4" />
                            <stop offset="100%" stop-color="#007a72" />
                        </linearGradient>
                        <linearGradient id="rosa-festivo" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ffc1e0" />
                            <stop offset="50%" stop-color="#ff4da6" />
                            <stop offset="100%" stop-color="#a8005f" />
                        </linearGradient>
                        <filter id="sombra-confeti" x="-20%" y="-20%" width="150%" height="150%">
                            <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.6" />
                        </filter>
                    </defs>
                    <g class="conf-a">
                        <rect x="954" y="-8" width="9" height="15" rx="1.5" fill="url(#oro-metalico)" style="--rot: 15deg; animation: fall1 5s linear infinite; animation-delay: -0.5s; transform-box: fill-box; transform-origin: center" />
                        <rect x="1032" y="-6" width="11" height="17" rx="1.5" fill="url(#cobre-metalico)" style="--rot: 8deg; animation: fall2 8.1s linear infinite; animation-delay: -2s; transform-box: fill-box; transform-origin: center" />
                        <rect x="284" y="-11" width="9" height="12" rx="1.5" fill="url(#rojo-festivo)" style="--rot: 53deg; animation: fall3 8s linear infinite; animation-delay: 4.7s; transform-box: fill-box; transform-origin: center" />
                        <rect x="890" y="-9" width="11" height="18" rx="1.5" fill="url(#blanco-festivo)" style="--rot: -35deg; animation: fall4 6.4s linear infinite; animation-delay: 1.9s; transform-box: fill-box; transform-origin: center" />
                        <rect x="302" y="-10" width="8" height="11" rx="1.5" fill="url(#turquesa-festivo)" style="--rot: 17deg; animation: fall1 7.4s linear infinite; animation-delay: 4.7s; transform-box: fill-box; transform-origin: center" />
                        <rect x="885" y="-5" width="10" height="14" rx="1.5" fill="url(#rosa-festivo)" style="--rot: 48deg; animation: fall2 7.4s linear infinite; animation-delay: -4.2s; transform-box: fill-box; transform-origin: center" />
                        <rect x="930" y="-2" width="9" height="15" rx="1.5" fill="url(#oro-metalico)" style="--rot: 4deg; animation: fall3 8.4s linear infinite; animation-delay: 8s; transform-box: fill-box; transform-origin: center" />
                        <rect x="297" y="-11" width="8" height="12" rx="1.5" fill="url(#cobre-metalico)" style="--rot: 49deg; animation: fall4 7.7s linear infinite; animation-delay: -2.8s; transform-box: fill-box; transform-origin: center" />
                        <rect x="208" y="-10" width="11" height="16" rx="1.5" fill="url(#rojo-festivo)" style="--rot: -50deg; animation: fall1 7.9s linear infinite; animation-delay: -2.4s; transform-box: fill-box; transform-origin: center" />
                        <rect x="924" y="-16" width="9" height="13" rx="1.5" fill="url(#blanco-festivo)" style="--rot: 32deg; animation: fall2 6.3s linear infinite; animation-delay: 0.6s; transform-box: fill-box; transform-origin: center" />
                        <rect x="302" y="-4" width="11" height="15" rx="1.5" fill="url(#turquesa-festivo)" style="--rot: 37deg; animation: fall3 6.4s linear infinite; animation-delay: -6s; transform-box: fill-box; transform-origin: center" />
                        <rect x="154" y="2" width="11" height="17" rx="1.5" fill="url(#rosa-festivo)" style="--rot: -39deg; animation: fall4 4.8s linear infinite; animation-delay: 2.9s; transform-box: fill-box; transform-origin: center" />
                        <rect x="974" y="-5" width="11" height="18" rx="1.5" fill="url(#oro-metalico)" style="--rot: -43deg; animation: fall1 5.8s linear infinite; animation-delay: 3.3s; transform-box: fill-box; transform-origin: center" />
                        <rect x="276" y="-10" width="12" height="18" rx="1.5" fill="url(#cobre-metalico)" style="--rot: 27deg; animation: fall2 5.1s linear infinite; animation-delay: 0.2s; transform-box: fill-box; transform-origin: center" />
                        <rect x="258" y="-5" width="9" height="14" rx="1.5" fill="url(#rojo-festivo)" style="--rot: 53deg; animation: fall3 7.9s linear infinite; animation-delay: 3s; transform-box: fill-box; transform-origin: center" />
                        <rect x="302" y="-8" width="9" height="13" rx="1.5" fill="url(#blanco-festivo)" style="--rot: -50deg; animation: fall4 6.5s linear infinite; animation-delay: 5.8s; transform-box: fill-box; transform-origin: center" />
                        <rect x="1007" y="-9" width="10" height="14" rx="1.5" fill="url(#turquesa-festivo)" style="--rot: -25deg; animation: fall1 5.4s linear infinite; animation-delay: 0.3s; transform-box: fill-box; transform-origin: center" />
                        <rect x="894" y="-10" width="11" height="18" rx="1.5" fill="url(#rosa-festivo)" style="--rot: 3deg; animation: fall2 7.4s linear infinite; animation-delay: 2.1s; transform-box: fill-box; transform-origin: center" />
